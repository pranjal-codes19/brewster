<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE BREWSTER - Gallery</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 30px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f6e0c3, #c98245);
            min-height: 100vh;
        }

        /* Heading */

        h1 {
            text-align: center;
            font-style: italic;
            color: #5a2d1a;
            font-size: 60px;
            margin: 10px 0 10px;

            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        }

        .subtitle {
            text-align: center;
            color: #6b3b25;
            font-size: 18px;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        /* Image Gallery */

        .code {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;

            max-width: 1300px;
            margin: auto;
        }

        .code img {
            width: 100%;
            height: 280px;

            object-fit: cover;
            display: block;

            border-radius: 15px;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.35);

            transition:
                transform 0.4s ease,
                box-shadow 0.4s ease;
        }

        /* Image Hover Effect */

        .code img:hover {
            transform: scale(1.05);

            box-shadow:
                0 15px 30px rgba(0, 0, 0, 0.55);
        }

        /* Menu Button Area */

        .menu-container {
            text-align: center;
            margin-top: 45px;
        }

        .menu-btn {
            display: inline-block;

            padding: 14px 40px;

            background-color: #5a2d1a;
            color: white;

            text-decoration: none;
            font-size: 18px;
            font-weight: bold;

            border-radius: 30px;

            box-shadow:
                0 6px 15px rgba(0, 0, 0, 0.3);

            transition:
                background-color 0.3s ease,
                transform 0.3s ease,
                box-shadow 0.3s ease;
        }

        /* Button Hover */

        .menu-btn:hover {
            background-color: #8b4a2f;

            transform: translateY(-4px);

            box-shadow:
                0 10px 20px rgba(0, 0, 0, 0.4);
        }

        /* Tablet */

        @media (max-width: 900px) {

            .code {
                grid-template-columns: repeat(2, 1fr);
            }

        }

        /* Mobile */

        @media (max-width: 600px) {

            body {
                padding: 25px 15px;
            }

            h1 {
                font-size: 40px;
            }

            .subtitle {
                font-size: 15px;
            }

            .code {
                grid-template-columns: 1fr;
            }

            .code img {
                height: 250px;
            }

        }

    </style>

</head>


<body>

    <h1>CAFETERIA</h1>

    <div class="subtitle">
        A PLACE TO RELAX, SIP & ENJOY
    </div>


    <!-- Gallery -->

    <div class="code">

        <img src="{{ url_for('static', filename='code.jpg') }}" alt="Cafe Image">

        <img src="{{ url_for('static', filename='code2.jpg') }}" alt="Cafe Image">

        <img src="{{ url_for('static', filename='code3.jpg') }}" alt="Cafe Image">

        <img src="{{ url_for('static', filename='code4.jpg') }}" alt="Cafe Image">

        <img src="{{ url_for('static', filename='code5.jpg') }}" alt="Cafe Image">

        <img src="{{ url_for('static', filename='code6.jpg') }}" alt="Cafe Image">

    </div>


    <!-- Menu Button -->

    <div class="menu-container">

        <a href="{{ url_for('menu') }}" class="menu-btn">
            ☕ View Menu
        </a>

    </div>


</body>

</html>
